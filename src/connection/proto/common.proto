syntax = "proto3";

package common;

enum StatusCode {
    STATUS_OK = 0;
    STATUS_ERROR = 1;
    STATUS_INVALID_REQUEST = 2;
    STATUS_UNAUTHORIZED = 3;
    STATUS_UNHANDLED_STATE = 4;
}

message Status {
    StatusCode code = 1;
    string message = 2;
}

message RequestHeader {
    uint64 id = 1;
}

message ResponseHeader {
    uint64 reply_to = 1;
    Status status = 2;
}
