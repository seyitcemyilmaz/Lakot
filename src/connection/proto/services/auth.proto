syntax = "proto3";

package services.auth;

enum RegisterStatus {
    REGISTER_STATUS_OK = 0;
    REGISTER_STATUS_EMAIL_IN_USE = 1;
    REGISTER_STATUS_USERNAME_IN_USE = 2;
    REGISTER_STATUS_DATABASE_ERROR = 3;
    REGISTER_STATUS_SYSTEM_ERROR = 4;
}

message RegisterRequest
{
    string username = 1;
    string password = 2;
    string email = 3;
}

message RegisterResponse
{
    RegisterStatus register_status = 1;
}

message LoginRequest {
    string username = 1;
    string password = 2;
}

message LoginResponse {
    string token = 1;

    // Restored from the account's last saved state (see AccountRepository) -
    // where the client should spawn the player. Plain scalars, not the
    // world service's Vector3/MapId, so auth.proto stays self-contained.
    uint32 map_id = 2;
    float pos_x = 3;
    float pos_y = 4;
    float pos_z = 5;
    float yaw = 6;
}
